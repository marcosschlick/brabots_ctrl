name: ctrl
description: "Android Bluetooth controller for Arduino robot cars."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter
  flutter_bluetooth_serial: ^0.4.0
  google_fonts: ^8.1.0
  permission_handler: ^12.0.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  image_path_android: "assets/icons/brabots_ctrl_icon.png"
  adaptive_icon_background: "#123F78"
  adaptive_icon_foreground: "assets/icons/brabots_ctrl_foreground.png"
